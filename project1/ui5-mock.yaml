specVersion: "3.1"
metadata:
  name: project1
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: sap-fe-mockserver
      beforeMiddleware: compression
      configuration:
        mountPath: /
        services:
          - urlPath: /odata/v2
            metadataPath: ./webapp/localService/v2/metadata.xml
            mockdataPath: ./webapp/localService/v2/data
            generateMockData: false
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
